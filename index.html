<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord Real API Dispatcher</title>
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'gg sans', 'Noto Sans', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background-color: #2b2d31;
            padding: 24px;
            border-radius: 8px;
            width: 450px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        h2 { margin: 0; color: #f2f3f5; font-size: 18px; }
        label { font-size: 11px; font-weight: bold; color: #949ba4; text-transform: uppercase; }
        input, select {
            background-color: #1e1f22;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #dbdee1;
            padding: 10px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus { border-color: #5865f2; }
        button {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #4752c4; }
        .console {
            background-color: #1e1f22;
            border-radius: 4px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Discord API Direct Sender</h2>
        
        <div>
            <label>Your User Token (Authorization)</label>
            <input type="password" id="token" placeholder="MTI3...">
        </div>

        <div>
            <label>Target User ID</label>
            <input type="text" id="targetId" placeholder="123456789012345678">
        </div>

        <div>
            <label>Message Count</label>
            <input type="number" id="count" value="5" min="1" max="50">
        </div>

        <div>
            <label>Ad Template</label>
            <select id="adType">
                <option value="nitro">Free Nitro Gift Link</option>
                <option value="steam">Steam Wallet Gift</option>
                <option value="ban">Account Suspension Warning</option>
            </select>
        </div>

        <button onclick="executeRealSpam()">Send Real Messages</button>

        <div>
            <label>Execution Log</label>
            <div class="console" id="logBox">[+] Ready...</div>
        </div>
    </div>

    <script>
        const templates = {
            nitro: "Hey! Check out this free 3-month Discord Nitro gift: https://discord-nitro-gift.ru/claim",
            steam: "Yo, look at this $100 Steam Gift Card code I found: https://steamcommunity-gift.com/claim",
            ban: "URGENT: Your Discord account has been reported. Verify here to prevent deletion: https://verify-discord-user.com"
        };

        async function executeRealSpam() {
            const token = document.getElementById('token').value.trim();
            const recipientId = document.getElementById('targetId').value.trim();
            const count = parseInt(document.getElementById('count').value) || 1;
            const adType = document.getElementById('adType').value;
            const logBox = document.getElementById('logBox');
            const messageText = templates[adType];

            if (!token || !recipientId) {
                logBox.innerHTML += `<br><span style="color:#ef4444;">[!] Error: Token and Target ID required.</span>`;
                return;
            }

            logBox.innerHTML += `<br>[*] Opening DM channel with user ${recipientId}...`;

            try {
                // Step 1: Create or get DM channel ID with the target user
                const dmRes = await fetch('https://discord.com/api/v9/users/@me/channels', {
                    method: 'POST',
                    headers: {
                        'Authorization': token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ recipient_id: recipientId })
                });

                if (!dmRes.ok) {
                    const errText = await dmRes.text();
                    logBox.innerHTML += `<br><span style="color:#ef4444;">[!] Failed to open DM: ${dmRes.status}</span>`;
                    return;
                }

                const dmData = await dmRes.json();
                const channelId = dmData.id;
                logBox.innerHTML += `<br>[+] DM Channel acquired (${channelId}). Sending payloads...`;

                // Step 2: Loop and send actual messages to the DM channel
                for (let i = 1; i <= count; i++) {
                    const msgRes = await fetch(`https://discord.com/api/v9/channels/${channelId}/messages`, {
                        method: 'POST',
                        headers: {
                            'Authorization': token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ content: messageText })
                    });

                    if (msgRes.ok) {
                        logBox.innerHTML += `<br>[>] Message ${i}/${count} sent successfully.`;
                    } else {
                        logBox.innerHTML += `<br><span style="color:#eab308;">[!] Rate limited or error on msg ${i} (${msgRes.status})</span>`;
                    }
                    
                    logBox.scrollTop = logBox.scrollHeight;
                    await new Promise(r => setTimeout(r, 1000)); // 1s delay to avoid instant rate-limits
                }

                logBox.innerHTML += `<br>[+] Sequence complete.`;

            } catch (err) {
                logBox.innerHTML += `<br><span style="color:#ef4444;">[!] Network/CORS Exception: Run via browser console or local extension.</span>`;
            }
        }
    </script>
</body>
</html>
